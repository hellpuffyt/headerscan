<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">headerscan pipeline</title>
<desc id="d">A CLI target flows through fetch.rs (the only network I/O) into the pure modules headers.rs, analyze.rs and report.rs, which turn response headers into findings, a score and a grade, then text or JSON output and an exit code.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A3AAA6"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3FBF8A"/></marker></defs>
<rect width="1200" height="470" fill="#0C0D0D"/>
<text x="30" y="40" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">headerscan: one GET per target, then pure analysis</text>
<text x="30" y="64" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A3AAA6" text-anchor="start" xml:space="preserve">Only fetch.rs touches the network. analyze() takes headers plus an is_https flag, so every rule is unit-tested offline.</text>
<rect x="216" y="88" width="192" height="296" rx="10" fill="none" stroke="#2A2E2D" stroke-width="1" stroke-dasharray="5 5"/>
<text x="224" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6" text-anchor="start" xml:space="preserve">network I/O</text>
<rect x="410" y="88" width="774" height="296" rx="10" fill="none" stroke="#2A2E2D" stroke-width="1" stroke-dasharray="5 5"/>
<text x="418" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#A3AAA6" text-anchor="start" xml:space="preserve">pure: no I/O, tested without a network</text>
<rect x="30" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="44" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">main.rs</text>
<text x="44" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">args to targets</text>
<text x="44" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">clap CLI</text>
<text x="44" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">URLS...</text>
<text x="44" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  bare host: https://</text>
<text x="44" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">--format text|json</text>
<text x="44" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">--timeout 10</text>
<text x="44" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">--no-redirects</text>
<text x="44" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">--min-score N</text>
<text x="44" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">--no-colour</text>
<text x="44" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  or NO_COLOR set</text>
<rect x="224" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="238" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">fetch.rs</text>
<text x="238" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">URL to Headers</text>
<text x="238" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">ureq 2 + rustls</text>
<text x="238" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">one GET per target</text>
<text x="238" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  up to 5 redirects</text>
<text x="238" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">4xx/5xx still audited</text>
<text x="238" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">body never read</text>
<text x="238" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">unreachable target:</text>
<text x="238" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  report, continue</text>
<text x="238" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">non-ASCII values:</text>
<text x="238" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  header-unreadable</text>
<rect x="418" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="432" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">headers.rs</text>
<text x="432" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">raw to parsed</text>
<text x="432" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">Headers</text>
<text x="432" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  case-insensitive</text>
<text x="432" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  every Set-Cookie</text>
<text x="432" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">parse_hsts</text>
<text x="432" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">Csp::parse</text>
<text x="432" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">Csp::effective</text>
<text x="432" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  falls back to</text>
<text x="432" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  default-src</text>
<text x="432" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">parse_cookie</text>
<rect x="612" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#3FBF8A" stroke-width="1"/>
<text x="626" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#3FBF8A" text-anchor="start" font-weight="600" xml:space="preserve">analyze.rs</text>
<text x="626" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">Headers to findings</text>
<text x="626" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_hsts</text>
<text x="626" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_csp</text>
<text x="626" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_clickjacking</text>
<text x="626" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_simple_headers</text>
<text x="626" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_cors</text>
<text x="626" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_cookies</text>
<text x="626" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">check_unreadable</text>
<text x="626" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  29 finding codes</text>
<text x="626" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  scheme-aware</text>
<rect x="806" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="820" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">Report</text>
<text x="820" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">findings to score</text>
<text x="820" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">sorted by severity</text>
<text x="820" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">start at 100</text>
<text x="820" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">high    -15</text>
<text x="820" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">medium   -8</text>
<text x="820" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">low      -3</text>
<text x="820" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">info      0</text>
<text x="820" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">A&gt;=90 B&gt;=80 C&gt;=70</text>
<text x="820" y="317" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">D&gt;=60 E&gt;=50 F&lt;50</text>
<rect x="1000" y="112" width="176" height="262" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="1014" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#EEEAE2" text-anchor="start" font-weight="600" xml:space="preserve">report.rs</text>
<text x="1014" y="158" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">Report to output</text>
<text x="1014" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">render_text</text>
<text x="1014" y="203" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">sanitize_for_terminal</text>
<text x="1014" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  escapes control and</text>
<text x="1014" y="241" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  bidi characters</text>
<text x="1014" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">render_json</text>
<text x="1014" y="279" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  summary + results</text>
<text x="1014" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#A3AAA6" text-anchor="start" xml:space="preserve">  lowest_score</text>
<line x1="208" y1="243.0" x2="222" y2="243.0" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="402" y1="243.0" x2="416" y2="243.0" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="596" y1="243.0" x2="610" y2="243.0" stroke="#3FBF8A" stroke-width="1.5" marker-end="url(#aa)"/>
<line x1="790" y1="243.0" x2="804" y2="243.0" stroke="#3FBF8A" stroke-width="1.5" marker-end="url(#aa)"/>
<line x1="984" y1="243.0" x2="998" y2="243.0" stroke="#A3AAA6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="402" width="1146" height="48" rx="8" fill="#17191A" stroke="#2A2E2D" stroke-width="1"/>
<text x="46" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3FBF8A" text-anchor="start" font-weight="600" xml:space="preserve">exit codes</text>
<text x="150" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">0  every target met --min-score (default 0)</text>
<text x="500" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">1  a target scored below it, or a request failed</text>
<text x="890" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#EEEAE2" text-anchor="start" xml:space="preserve">2  usage or serialisation error</text>
</svg>
